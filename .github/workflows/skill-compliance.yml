name: Skill Compliance Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  compliance:
    name: HARDLINE Compliance
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run compliance check (full)
        run: python3 scripts/check-skill-compliance.py

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Comment on PR (failure only)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try {
              // Re-run to capture clean output for the comment
              const { execSync } = require('child_process');
              try {
                output = execSync('python3 scripts/check-skill-compliance.py', { encoding: 'utf8' });
              } catch (e) {
                output = e.stdout + e.stderr;
              }
            } catch (e) {
              output = `(could not capture output: ${e.message})`;
            }

            const body = [
              '## ❌ Skill Compliance Check Failed',
              '',
              'One or more skills do not meet the MCP consolidation standards:',
              '- Description ≤1024 chars (proper YAML scalar parsing)',
              '- Full Hermes frontmatter (name, version, author, license, platforms, metadata)',
              '- Canonical section order (When to Use, Prerequisites, How to Run, etc.)',
              '- SKILL.md ≤500 lines',
              '- All relative links resolve and stay within skills/ directory',
              '- All files are reachable from SKILL.md',
              '- No symlinks',
              '- No forbidden strings (API keys, internal URLs, etc.)',
              '- All picsart_* tool names are served by the picsart MCP (scripts/picsart-mcp-tools.json)',
              '',
              'Fix locally with:',
              '',
              '```bash',
              'python3 scripts/check-skill-compliance.py',
              '# auto-fix structure/frontmatter (you may still need to edit prose):',
              'python3 scripts/normalize-skills.py',
              '```',
              '',
              '<details><summary>Full check output</summary>',
              '',
              '```',
              output.trim(),
              '```',
              '</details>',
              '',
              'See [CONTRIBUTING.md](../blob/main/CONTRIBUTING.md) for the full rules.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.body && c.body.includes('Skill Compliance Check Failed')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
